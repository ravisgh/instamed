# Weekly dependency update PRs; CI must pass before any of them can merge.
# Minor and patch bumps are grouped into one PR per ecosystem to keep noise low.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The client must match the server's major version (local, compose and CI run
      # Elasticsearch 8). Upgrade client and server together, by hand.
      - dependency-name: elasticsearch
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(deps)"
    ignore:
      # Stay on the Python version CI tests (3.13); take only its patch/security images.
      # Moving to a new Python minor is a deliberate change to Dockerfile + CI together.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
