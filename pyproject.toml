[project]
name = "instamed"
version = "0.1.0"
description = "InstaMed pharmacy backend (FastAPI + MongoDB)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
