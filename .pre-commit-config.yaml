# Install once:  pip install -r requirements-dev.txt; pre-commit install
# Run on everything:  pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: local
    hooks:
      # Stock exports, spreadsheets and env files must never be committed.
      - id: no-data-exports
        name: Block spreadsheets and .env files
        entry: Data exports and .env files must not be committed
        language: fail
        files: (\.xlsx$|\.csv$|(^|/)\.env($|\.))
